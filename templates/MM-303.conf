# MM-303 configuration
#
# Plain text, one "key = value" per line. Blank lines are ignored and a '#'
# anywhere starts a comment (rest of the line is dropped). A default file is
# created here on first run if one does not exist.

# ── Capture ───────────────────────────────────────────────────────────────────
# capture-path: folder where the Capture button writes files. If unset, or the
#   folder does not exist, <plugin dir>/Midi Clips is used.
#capture-path = /media/662522/303
#
# captureFormat: what the Capture button writes.
#   0 = Standard MIDI (.mid)                                [default]
#   1 = Akai .mpcpattern v1 (loads on every Force/MPC firmware)
#   2 = Akai .mpcpattern v2 (newer firmware only)
captureFormat = 0
#
# lastNote: a tie/slide on the boundary step (last step of the loop) — what
#   happens at the loop point.
#   0 = clamp at the loop end (default; the note stops, no bleed into step 0)
#   1 = let it extend/slide across the loop while playing
lastNote = 0
#
# debugDump: 1 = also write the raw internal state (<stamp>.seq.json) next to
#   each Capture. Diagnostics only; 0 by default.
debugDump = 0

# ── Positional transpose ──────────────────────────────────────────────────────
# Used when "Transpose" is on; "Octave Transpose" adds the octave term.
# base-octave: 3..6; the octave reference is base-octave * 12 (5 -> middle C =
#   60, 4 -> 48). octave-max: 1 or 2 octaves.
base-octave = 5
octave-max = 2

# ── MIDI CC map ───────────────────────────────────────────────────────────────
# <param-id> = <cc>, one per line. CC responds on any channel. DELETE a line to
# make that parameter NOT midi-mappable. Switch params: CC < 5 = off, >= 5 = on.
# Reserved: 0, 32, 64, 120-127.
#
# Mappable param ids (synth / mod / LFO / overdrive / filter):
#   waveform tuning cutoff resonance envmod decay accent volume
#   switchModState normalDecay accentDecay feedbackFilter softAttack slideTime sqrDriver
#   lfoWaveform lfoRate lfoDepth lfoDestination
#   switchOverdriveState overdriveLevel overdriveOutput overdriveBassBoost overdriveDryWet
#   filterType filterDrive bassComp
#
# Sequencer performance controls you can map as well:
#   rotation    Rotate (-63..+63): CC 0 = -63, 64 = 0, 127 = +63
#   seqLength   Seq Length (1..64)
#   seqTempo    Seq Tempo (20..300 BPM)
# (Transpose/Octave, generative and momentary controls are excluded.)

waveform = 20                    # Waveform
tuning = 21                      # Tuning
cutoff = 74                      # Cutoff
resonance = 71                   # Resonance
envmod = 73                      # EnvMod
decay = 75                       # Decay
accent = 76                      # Accent
volume = 8                       # Volume (not CC7: Force resets CC7 on play)
lfoRate = 37                     # LFO Rate
lfoDepth = 38                    # LFO Depth

overdriveLevel = 41              # Drive
overdriveOutput = 42             # Output
overdriveBassBoost = 43          # Bass Boost
overdriveDryWet = 44             # Dry/Wet

# Sequencer performance examples (uncomment to enable):
#rotation = 50                    # Rotate (map a CC/pad to jump phrases)
#seqLength = 51                   # Seq Length
#seqTempo = 52                    # Seq Tempo
